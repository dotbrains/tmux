# Tokyo Night tmux theme

set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left-style "bg=#283457,fg=#7aa2f7,bold"
set -g status-right-style "bg=#283457,fg=#9ece6a"
set -g window-status-current-style "bg=#414868,fg=#7aa2f7,bold"
set -g window-status-style "bg=#1a1b26,fg=#a9b1d6"
set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#283457,fg=#c0caf5"
set -g mode-style "bg=#414868,fg=#e0af68"
