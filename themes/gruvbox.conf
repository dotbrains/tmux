# Gruvbox tmux theme

set -g status-style "bg=#282828,fg=#ebdbb2"
set -g status-left-style "bg=#3c3836,fg=#fabd2f,bold"
set -g status-right-style "bg=#3c3836,fg=#8ec07c"
set -g window-status-current-style "bg=#504945,fg=#fabd2f,bold"
set -g window-status-style "bg=#282828,fg=#a89984"
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#fabd2f"
set -g message-style "bg=#3c3836,fg=#ebdbb2"
set -g mode-style "bg=#504945,fg=#fabd2f"
