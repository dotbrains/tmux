# Solarized Dark tmux theme

set -g status-style "bg=#002b36,fg=#839496"
set -g status-left-style "bg=#073642,fg=#268bd2,bold"
set -g status-right-style "bg=#073642,fg=#859900"
set -g window-status-current-style "bg=#073642,fg=#b58900,bold"
set -g window-status-style "bg=#002b36,fg=#586e75"
set -g pane-border-style "fg=#073642"
set -g pane-active-border-style "fg=#268bd2"
set -g message-style "bg=#073642,fg=#93a1a1"
set -g mode-style "bg=#073642,fg=#b58900"
