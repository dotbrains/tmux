# Rose Pine tmux theme

set -g status-style "bg=#191724,fg=#e0def4"
set -g status-left-style "bg=#393552,fg=#9ccfd8,bold"
set -g status-right-style "bg=#393552,fg=#31748f"
set -g window-status-current-style "bg=#403d52,fg=#c4a7e7,bold"
set -g window-status-style "bg=#191724,fg=#908caa"
set -g pane-border-style "fg=#6e6a86"
set -g pane-active-border-style "fg=#9ccfd8"
set -g message-style "bg=#393552,fg=#e0def4"
set -g mode-style "bg=#403d52,fg=#f6c177"
