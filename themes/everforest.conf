# Everforest tmux theme

set -g status-style "bg=#2d353b,fg=#d3c6aa"
set -g status-left-style "bg=#3a515d,fg=#7fbbb3,bold"
set -g status-right-style "bg=#3a515d,fg=#a7c080"
set -g window-status-current-style "bg=#475258,fg=#dbbc7f,bold"
set -g window-status-style "bg=#2d353b,fg=#859289"
set -g pane-border-style "fg=#475258"
set -g pane-active-border-style "fg=#7fbbb3"
set -g message-style "bg=#3a515d,fg=#d3c6aa"
set -g mode-style "bg=#475258,fg=#dbbc7f"
