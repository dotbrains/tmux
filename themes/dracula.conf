# Dracula tmux theme

set -g status-style "bg=#282a36,fg=#f8f8f2"
set -g status-left-style "bg=#44475a,fg=#bd93f9,bold"
set -g status-right-style "bg=#44475a,fg=#50fa7b"
set -g window-status-current-style "bg=#44475a,fg=#ff79c6,bold"
set -g window-status-style "bg=#282a36,fg=#6272a4"
set -g pane-border-style "fg=#6272a4"
set -g pane-active-border-style "fg=#bd93f9"
set -g message-style "bg=#44475a,fg=#f8f8f2"
set -g mode-style "bg=#44475a,fg=#f1fa8c"
